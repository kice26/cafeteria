<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#177a4a"><link rel="manifest" href="manifest.webmanifest"><title>한국교육과정평가원 구내식당 메뉴</title><style>
:root{--ink:#1d2c24;--muted:#6c7a72;--line:#e4ebe6;--green:#177a4a}*{box-sizing:border-box}body{margin:0;background:#f3faf5;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}main{width:min(560px,calc(100% - 28px));margin:auto;padding:calc(28px + env(safe-area-inset-top)) 0 36px}header{text-align:center;margin-bottom:25px}.badge{display:inline-block;padding:7px 12px;border-radius:99px;background:#dff3e7;color:var(--green);font-size:13px;font-weight:bold}h1{margin:13px 0 8px;font-size:clamp(27px,7vw,35px);letter-spacing:-2px}header p,.time,.org{margin:0;color:var(--muted);font-size:14px}.picker,.meal{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px #22412d0f}.picker{padding:16px}.picker-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;font-weight:bold}input{width:142px;padding:8px;border:1px solid #cbd8d0;border-radius:9px;font:inherit;font-size:13px}.dates{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.date{min-height:58px;padding:3px 1px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-size:11px}.date b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}.date.active{background:var(--green);border-color:var(--green);color:#dff5e8}.date.active b{color:white}.title{margin:27px 2px 13px}.title h2{margin:0;font-size:24px;letter-spacing:-1px}.org{margin-top:4px;font-size:12px}.meals{display:grid;gap:14px}.head{padding:18px 20px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.head h3{margin:0;font-size:21px}.tag{height:max-content;padding:6px 9px;border-radius:7px;background:#eef8f2;color:var(--green);font-size:11px;font-weight:bold}.section{padding:15px 20px 18px}.section+.section{border-top:1px dashed #dbe5de}.section h4{margin:0 0 9px;color:var(--green);font-size:12px;letter-spacing:1px}ul{list-style:none;margin:0;padding:0}li{position:relative;padding:6px 0 6px 15px;font-size:15px}li:before{content:"";position:absolute;left:0;top:14px;width:5px;height:5px;border-radius:50%;background:#8cc5a3}.menu li:first-child{color:#c73535;font-weight:bold}.menu li:nth-child(2){color:#2466bd;font-weight:bold}.closed{padding:20px;color:var(--muted)}footer{display:flex;gap:10px;margin-top:18px;padding:16px 18px;border-radius:13px;background:#e8f5ed;color:#456454;font-size:13px;line-height:1.5}footer b{color:var(--green)}@media(max-width:390px){main{width:calc(100% - 22px)}.picker-top{display:block}.picker-top input{display:block;width:100%;margin-top:10px}}
</style></head><body><main id="app">불러오는 중입니다.</main><script src="menu-data.js"></script><script>
const A=document.querySelector('#app'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),list=(x,c='')=>`<ul class="${c}">${x.map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`;function render(d,k){let m=d.menus[k],dates=Object.keys(d.menus),card=(name,time,items,plus)=>`<article class="meal"><div class="head"><div><h3>${name}</h3><p class="time">${time}</p></div><span class="tag">${name==='중식'?'LUNCH':'DINNER'}</span></div>${items?`<div class="section"><h4>MENU</h4>${list(items,'menu')}</div>${plus?`<div class="section"><h4>PLUS BAR</h4>${list(plus)}</div>`:''}`:'<p class="closed">금요일 석식은 운영하지 않습니다.</p>'}</article>`;A.innerHTML=`<header><span class="badge">${d.weekLabel}</span><h1>한국교육과정평가원 구내식당 메뉴</h1><p>날짜를 선택해 중식과 석식 메뉴를 확인하세요.</p></header><section class="picker"><div class="picker-top"><label>식단 날짜 선택</label><input id="pick" type="date" min="${dates[0]}" max="${dates.at(-1)}"></div><div class="dates">${dates.map(x=>`<button class="date ${x===k?'active':''}" data-d="${x}"><b>${x.slice(5).replace('-','/')}</b>${d.menus[x].day}요일</button>`).join('')}</div></section><div class="title"><h2>${Number(k.slice(5,7))}월 ${Number(k.slice(8))}일 (${m.day})</h2><p class="org">한울F&amp;S · 한국교육과정평가원</p></div><section class="meals">${card('중식','11:30 ~ 12:30',m.lunch,m.plus)}${card('석식','17:30 ~ 18:30',m.dinner)}</section><footer><b>안내</b><span>식단은 식자재 수급사정에 의해 변경될 수 있습니다.</span></footer>`;document.querySelectorAll('.date').forEach(b=>b.onclick=()=>render(d,b.dataset.d));let p=document.querySelector('#pick');p.value=k;p.onchange=e=>d.menus[e.target.value]&&render(d,e.target.value)}fetch('menu.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>render(d,Object.keys(d.menus)[0])).catch(()=>{if(window.menuData)render(window.menuData,Object.keys(window.menuData.menus)[0]);else A.textContent='식단 정보를 불러오지 못했습니다.'});if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script><script>
(() => {
  const existingRender = window.render;
  const chooseInitialDate = data => {
    const dates = Object.keys(data.menus).sort();
    const now = new Date();
    const today = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), String(now.getDate()).padStart(2, '0')].join('-');
    return dates.find(date => date >= today) || dates[0];
  };

  window.render = (data, date) => {
    if (!window.__initialMenuDateSelected) {
      date = chooseInitialDate(data);
      window.__initialMenuDateSelected = true;
    }
    return existingRender(data, date);
  };
})();
</script></body></html>
