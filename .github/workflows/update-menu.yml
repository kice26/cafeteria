name: Update weekly menu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/weekly_menu.xlsx
      - .github/workflows/update-menu.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert Excel to menu data
        run: python scripts/xlsx_to_menu.py data/weekly_menu.xlsx menu.json menu-data.js
        env:
          MENU_YEAR: ${{ vars.MENU_YEAR }}

      - name: Save updated menu files
        run: |
          git config user.name "menu-updater[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json menu-data.js
          git diff --staged --quiet || (git commit -m "Update weekly menu data" && git push)
