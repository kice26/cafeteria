name: Update weekly menu
on:
  push:
    branches: [main]
    paths: [data/weekly_menu.xlsx]
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/xlsx_to_menu.py data/weekly_menu.xlsx menu.json menu-data.js
        env: {MENU_YEAR: '${{ vars.MENU_YEAR }}'}
      - run: |
          git config user.name 'menu-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu.json menu-data.js
          git diff --staged --quiet || (git commit -m 'Update weekly menu data' && git push)
